[project]
name = "rag"
version = "0.1.0"
description = "RAG against the machine project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fire>=0.7.1",
    "flake8-pyproject>=1.2.4",
    "mypy>=2.4.1",
    "pydantic>=2.14.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
    "types-tqdm>=4.70.0.20261106",
]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu"}]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.mypy]
files = ["src"]
exclude = ["data/"]
[tool.flake8]
extend-exclude = [
    ".git",
    "__pycache__",
    ".venv",
	"data",
    "moulinette",
]
